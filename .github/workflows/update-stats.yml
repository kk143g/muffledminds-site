name: Update homepage stats

on:
  schedule:
    - cron: "0 6 */2 * *"   # every 2 days at 06:00 UTC (11:00 Pakistan time)
  workflow_dispatch:         # "Run workflow" button for a manual refresh

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh subscribers, episodes and Instagram counts
        env:
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
        run: python3 scripts/update_stats.py
      - name: Commit and push if anything changed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "Khawar Shahzad"
            git config user.email "khawarkhang@gmail.com"
            git add -A
            git commit -m "Auto-update homepage stats"
            git push
          else
            echo "No change."
          fi
